# Scheduled rate-monitoring workflow — Phase 7/8 (Supabase-backed)
# ===================================================================
# STATUS: scaffold only, intentionally NOT active.
#
# As of Phase 2, live retrieval for My Money Master is real and working —
# but it runs inside `.github/workflows/pages.yml`, not this file. That
# workflow re-checks the rate and regenerates frontend/data/latest-rates.json
# on every deploy, which is enough to get a genuinely live number onto the
# static dashboard without needing a database yet (see the comment at the
# top of pages.yml and backend/scripts/checkRate.js for why).
#
# THIS file is reserved for the architecture actually described in the
# approved Phase 7/8 plan: a workflow that runs on its own schedule
# (independent of deploys), calls every adapter (not just My Money
# Master), and writes to Supabase using a service-role secret — enabling
# true multi-user alerts, rate history, and Realtime push notifications,
# none of which a static JSON file can do. Activate this (and retire the
# check step in pages.yml) once:
#
#   1. Taj Muhabath's adapter is real (Phase 3) — right now only
#      My Money Master has one.
#   2. Rate validation is applied to both adapters (Phase 4) — My Money
#      Master's is wired in backend/validation/validateRate.js already;
#      Taj Muhabath's staggered-row timing needs its own settle logic.
#   3. Supabase is provisioned and SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY
#      are added as encrypted repo secrets (Settings -> Secrets and
#      variables -> Actions). Never commit these values — see .env.example.
#   4. The Terms of Use compliance review noted in
#      config/websites/mymoneymaster.json has been done, since this file's
#      whole point is to run unattended on a recurring cron.
#
# Then replace the placeholder run step below with the real entry point
# (e.g. `node backend/scheduler/run.js`), uncomment the `schedule:` block,
# and this workflow can be enabled independently of pages.yml.

name: Monitor Exchange Rates (Phase 7/8 — Supabase, not yet active)

on:
  workflow_dispatch: {} # manual "Run workflow" button only, for now
  # schedule:
  #   - cron: '*/5 * * * *'

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Install Playwright browsers
        working-directory: backend
        run: npx playwright install --with-deps chromium

      - name: Placeholder — Supabase-backed pipeline not implemented yet
        run: |
          echo "Phase 2 note: My Money Master's live check now runs for"
          echo "real, but from .github/workflows/pages.yml, not this file."
          echo "This workflow is reserved for the Phase 7/8 Supabase-backed"
          echo "pipeline (Taj Muhabath + multi-user + rate history). See the"
          echo "header comment in this file for the activation checklist."
          exit 0
