# Scheduled rate-monitoring workflow — Phase 8/10 (Supabase-backed, real delivery)
# =====================================================================================
# STATUS: real pipeline implemented (Phase 8, 22-Aug-2026), real email/Telegram
# delivery added (Phase 10, same day). Every "Run workflow" trigger now calls
# backend/scheduler/run.js, which: fetches every ACTIVE alert from Supabase,
# checks both adapters (deduplicated — one live check per distinct
# source+currency+branch combo, not one per alert), writes every reading
# (success or failure) to the `rates` table, evaluates each alert against the
# best rate across its selected sources (backend/targetEngine/compareTarget.js),
# and — the moment a target is met — marks that alert TRIGGERED, sends a real
# notification via backend/notifications/notify.js (email via Resend, or
# Telegram — whichever the alert's notification_method is set to), and inserts
# a `notifications` row recording the actual DELIVERED/FAILED/PENDING outcome.
# See backend/scheduler/run.js's own header comment for the full design
# rationale (best-rate-across-sources, real delivery resolution, etc.).
#
# RESEND_API_KEY and TELEGRAM_BOT_TOKEN below are optional in the sense that
# the run itself won't fail without them — but any active alert using
# notification_method 'email' or 'telegram' will have its delivery recorded
# as FAILED (with a clear reason) if the matching secret isn't set. See
# NOTIFICATIONS_SETUP.md for how to obtain and add both.
#
# This workflow itself still runs on MANUAL TRIGGER ONLY — there is no
# recurring cron yet. The original Phase 7/8 activation checklist:
#
#   1. Taj Muhabath's adapter is real (Phase 3) — DONE.
#   2. Rate validation is applied to both adapters (Phase 4) — DONE.
#   3. Supabase is provisioned, SUPABASE_URL / SUPABASE_ANON_KEY are live
#      in frontend/supabaseConfig.js (Phase 7) — DONE. Confirm
#      SUPABASE_SERVICE_ROLE_KEY has also been added as an encrypted
#      GitHub Actions secret (Settings -> Secrets and variables -> Actions
#      -> New repository secret) before this workflow can succeed at all —
#      see SUPABASE_SETUP.md step 6.
#   4. The Terms of Use compliance review noted in
#      config/websites/mymoneymaster.json and
#      config/websites/tajmuhabath.json — STILL NOT DONE. This is the one
#      remaining blocker before the `schedule:` block below is ever
#      uncommented. A human should read both sites' Terms of Use and
#      confirm continuous, unattended polling is permitted before this
#      workflow runs on any recurring interval.
#
# Once item 4 is cleared: uncomment the `schedule:` block below (a 5-minute
# interval matches the dashboard's own default monitoring interval). Every
# other prerequisite is already satisfied as of this Phase 8 build.

name: Monitor Exchange Rates

on:
  workflow_dispatch: {} # manual "Run workflow" button only, until compliance item 4 above is cleared
  # schedule:
  #   - cron: '*/5 * * * *'

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Install Playwright browsers
        working-directory: backend
        run: npx playwright install --with-deps chromium

      - name: Run scheduled alert check
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node scheduler/run.js
