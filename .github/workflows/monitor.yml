# Scheduled rate-monitoring workflow — Phase 8/10 (Supabase-backed, real delivery)
# =====================================================================================
# STATUS: real pipeline implemented (Phase 8, 22-Aug-2026), real email/Telegram
# delivery added (Phase 10, same day), Merchantrade Asia adapter added
# (post-Phase 10, same day). Every "Run workflow" trigger now calls
# backend/scheduler/run.js, which: fetches every ACTIVE alert from Supabase,
# checks every registered adapter as needed (deduplicated — one live check
# per distinct source+currency+branch combo, not one per alert), writes
# every reading (success or failure) to the `rates` table, evaluates each
# alert against the
# best rate across its selected sources (backend/targetEngine/compareTarget.js),
# and — the moment a target is met — marks that alert TRIGGERED, sends a real
# notification via backend/notifications/notify.js (email via Resend, or
# Telegram — whichever the alert's notification_method is set to), and inserts
# a `notifications` row recording the actual DELIVERED/FAILED/PENDING outcome.
# See backend/scheduler/run.js's own header comment for the full design
# rationale (best-rate-across-sources, real delivery resolution, etc.).
#
# RESEND_API_KEY and TELEGRAM_BOT_TOKEN below are optional in the sense that
# the run itself won't fail without them — but any active alert using
# notification_method 'email' or 'telegram' will have its delivery recorded
# as FAILED (with a clear reason) if the matching secret isn't set. See
# NOTIFICATIONS_SETUP.md for how to obtain and add both.
#
# RECURRING SCHEDULE — enabled Phase 14 (22-Aug-2026), at the project
# owner's explicit request, on the SAME every-5-minute cadence that was
# already sitting here commented out since Phase 8. Before flipping this on,
# the compliance review item 4 below (a human actually reading each site's
# Terms of Use) was checked as far as tooling allowed:
#   - Merchantrade Asia: Terms & Conditions page WAS fetched and read
#     (https://mtradeasia.com/legal/terms-and-conditions) — no clause
#     addressing automated access/scraping/bots was found; robots.txt
#     explicitly allows the /exchange page (see that config file).
#   - My Money Master: no robots.txt restriction exists (404), but the
#     site's own Terms of Use page could not actually be fetched — it has
#     no working HTTPS (https:// redirects back to http://, and the
#     redirect loops), which this tooling cannot follow. NOT independently
#     read.
#   - Taj Muhabath: no public Terms of Use page could be located at all —
#     only a Privacy link and a registration-gated "terms" reference deeper
#     in the site. NOT independently read.
# In short: nothing found says "no," but two of the three were never
# actually read, for reasons outside this tool's control rather than being
# skipped. The project owner made an informed decision to proceed anyway,
# at a modest 5-minute interval, having been told this. If you are that
# owner and this reads differently than you intended, this schedule can be
# re-commented out at any time — see item 4 below.
#
# The original Phase 7/8 activation checklist:
#
#   1. Taj Muhabath's adapter is real (Phase 3) — DONE.
#   2. Rate validation is applied to both adapters (Phase 4) — DONE.
#   3. Supabase is provisioned, SUPABASE_URL / SUPABASE_ANON_KEY are live
#      in frontend/supabaseConfig.js (Phase 7) — DONE. Confirm
#      SUPABASE_SERVICE_ROLE_KEY has also been added as an encrypted
#      GitHub Actions secret (Settings -> Secrets and variables -> Actions
#      -> New repository secret) before this workflow can succeed at all —
#      see SUPABASE_SETUP.md step 6.
#   4. The Terms of Use compliance review noted in
#      config/websites/mymoneymaster.json,
#      config/websites/tajmuhabath.json, and
#      config/websites/merchantradeasia.json — see the note above this
#      checklist for exactly what was and wasn't actually verified.
#      OWNER DECIDED TO PROCEED, 22-Aug-2026 — the `schedule:` block below
#      was uncommented on that basis, not because every site was fully
#      cleared.
#
# Each alert's own monitoring_interval_minutes now actually matters (Phase
# 14): every run of this workflow only re-evaluates an alert whose own
# interval has elapsed since it was last checked — see run.js's
# isDueForCheck(). The workflow itself still can't check any single alert
# MORE often than this schedule runs (5 minutes), only less often. 
# (Phase 14 — recurring schedule, every 5 minutes)

name: Monitor Exchange Rates

on:
  workflow_dispatch: {} # keep manual "Run workflow" available too, e.g. to test a change immediately
  schedule:
    - cron: '*/5 * * * *'

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Install Playwright browsers
        working-directory: backend
        run: npx playwright install --with-deps chromium

      - name: Run scheduled alert check
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node scheduler/run.js
