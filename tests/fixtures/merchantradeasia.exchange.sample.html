  response has the row skeleton but empty currency/rate content — see the
  adapter's header comment). This represents page.content() after
  Playwright's waitForSelector + settle wait, which is exactly what the
  real adapter reads.

  column classes (col-3 text-center / col-3 text-end) match the data rows'

  verified live rather than assumed.

  actually tested against) to prove the matcher correctly locates ONE
  specific currency by its display-name text rather than always matching
  the first data row on the page. This site has denomination-split rows for
  some currencies (e.g. "USD BIG" / "USD MEDIUM" / "USD SMALL") which are
  deliberately NOT included here since this adapter only targets CNY, which
  has a single row.
-->
